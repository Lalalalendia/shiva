name: Shiva Semantic PDF Mutation QA

on:
  pull_request:
    paths:
      - 'lib/tests/pdf_semantic_mutations.rs'
      - 'lib/src/pdf.rs'
      - 'lib/src/pdf/**'
      - 'lib/Cargo.toml'
      - 'scripts/ci/generate-reportlab-pdf-corpus.py'
      - 'scripts/ci/pinned-pdf-corpus-manifest.json'
      - '.github/workflows/pdf-semantic-mutation.yml'
  push:
    branches: [main]
    paths:
      - 'lib/tests/pdf_semantic_mutations.rs'
      - 'lib/src/pdf.rs'
      - 'lib/src/pdf/**'
      - 'lib/Cargo.toml'
      - 'scripts/ci/generate-reportlab-pdf-corpus.py'
      - 'scripts/ci/pinned-pdf-corpus-manifest.json'
      - '.github/workflows/pdf-semantic-mutation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-mutation-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact ReportLab generator and verification dependencies
        run: |
          python -m pip install --only-binary=:all: pillow==11.3.0 charset-normalizer==3.4.3
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r scripts/ci/reportlab-qa-requirements.txt
          python -m pip check
      - name: Provision immutable SHA-pinned CC0 PDFs
        run: |
          python scripts/ci/fetch-pinned-pdf-corpus.py --manifest scripts/ci/pinned-pdf-corpus-manifest.json --out "$RUNNER_TEMP/shiva-pdf-lib"
      - name: Generate three deterministic ReportLab PDFs
        run: python scripts/ci/generate-reportlab-pdf-corpus.py --out "$RUNNER_TEMP/shiva-reportlab"
      - name: Prove fail-closed and complete semantic page-oracle mutations
        env:
          SHIVA_QA_PINNED_PDF_DIR: ${{ runner.temp }}/shiva-pdf-lib
          SHIVA_QA_REPORTLAB_DIR: ${{ runner.temp }}/shiva-reportlab
        run: |
          cargo test -p shiva --no-default-features --features qa-external-pdf,markdown,html,xml --test pdf_semantic_mutations -- --nocapture

  bounded-mutation-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact ReportLab generator and verification dependencies
        run: |
          python -m pip install --only-binary=:all: pillow==11.3.0 charset-normalizer==3.4.3
          if ($LASTEXITCODE -ne 0) { throw 'QA generator dependency installation failed' }
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r scripts/ci/reportlab-qa-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'QA generator wheel digest mismatch' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'ReportLab dependencies invalid' }
      - name: Provision immutable SHA-pinned CC0 PDFs
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'shiva-pdf-lib'
          python scripts/ci/fetch-pinned-pdf-corpus.py --manifest scripts/ci/pinned-pdf-corpus-manifest.json --out $dest
          if ($LASTEXITCODE -ne 0) { throw 'CC0 sample integrity verification failed' }
      - name: Generate three deterministic ReportLab PDFs
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'shiva-reportlab'
          python scripts/ci/generate-reportlab-pdf-corpus.py --out $dest
          if ($LASTEXITCODE -ne 0) { throw 'ReportLab expected output hash mismatch' }
      - name: Prove fail-closed and complete semantic page-oracle mutations
        env:
          SHIVA_QA_PINNED_PDF_DIR: ${{ runner.temp }}/shiva-pdf-lib
          SHIVA_QA_REPORTLAB_DIR: ${{ runner.temp }}/shiva-reportlab
        run: |
          cargo test -p shiva --no-default-features --features qa-external-pdf,markdown,html,xml --test pdf_semantic_mutations -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'PDF mutation semantic invariant failed' }
