name: Shiva native Windows sandbox acceptance

on:
  pull_request:
    paths:
      - 'worker/**'
      - 'worker-client/**'
      - 'extractor-protocol/**'
      - 'Cargo.toml'
      - '.github/workflows/worker-windows.yml'
      - 'docs/architecture/windows-shiva-worker-v1.md'
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'worker-client/**'
      - 'extractor-protocol/**'
      - '.github/workflows/worker-windows.yml'
      - 'docs/architecture/windows-shiva-worker-v1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-real-appcontainer:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows Shiva executable
        run: cargo build -p shiva-worker --bin shiva-worker
      - name: Provision exact LPAC worker SID ACL and AAP-only negative canary
        run: |
          # Ephemeral CI fixture only. Production ACLs must be configured by a
          # trusted installer; Shiva must never grant execute on arbitrary paths.
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class ShivaLpacTestSid {
              [DllImport("userenv.dll", EntryPoint = "DeriveAppContainerSidFromAppContainerName", CharSet = CharSet.Unicode)]
              private static extern int Derive(string name, out IntPtr sid);
              [DllImport("advapi32.dll", EntryPoint = "ConvertSidToStringSidW", CharSet = CharSet.Unicode, SetLastError = true)]
              private static extern bool ToStringSid(IntPtr sid, out IntPtr text);
              [DllImport("advapi32.dll", EntryPoint = "FreeSid")]
              private static extern IntPtr FreeSid(IntPtr sid);
              [DllImport("kernel32.dll", EntryPoint = "LocalFree")]
              private static extern IntPtr LocalFree(IntPtr text);
              public static string Resolve(string name) {
                  IntPtr sid = IntPtr.Zero, text = IntPtr.Zero;
                  int hr = Derive(name, out sid);
                  if (hr < 0 || sid == IntPtr.Zero)
                      throw new Exception("DeriveAppContainerSidFromAppContainerName failed: " + hr.ToString("X8"));
                  try {
                      if (!ToStringSid(sid, out text) || text == IntPtr.Zero)
                          throw new Exception("ConvertSidToStringSidW failed");
                      try { return Marshal.PtrToStringUni(text); }
                      finally { LocalFree(text); }
                  } finally { FreeSid(sid); }
              }
          }
          '@
          $sid = [ShivaLpacTestSid]::Resolve("AkulaShivaWorkerNoNetworkV1")
          if ($sid -notmatch '^S-1-15-2-') { throw "Unexpected AppContainer SID" }
          $exe = Join-Path $env:GITHUB_WORKSPACE "target\debug\shiva-worker.exe"
          if (!(Test-Path -LiteralPath $exe)) { throw "Worker binary missing" }
          $grant = "*$($sid):(RX)"
          $current = (Get-Item -LiteralPath $exe).Directory
          while ($null -ne $current -and $current.FullName -ne $current.Root.FullName) {
            & icacls.exe $current.FullName /grant:r $grant | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Package SID directory traverse grant failed" }
            $current = $current.Parent
          }
          & icacls.exe $exe /grant:r $grant | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Package SID binary RX grant failed" }
          # This file is readable through ALL APPLICATION PACKAGES, but has
          # *no* grant to our exact AppContainer SID. LPAC must fail to read.
          $fixture = Join-Path $env:RUNNER_TEMP "shiva-aap-only-control.txt"
          [System.IO.File]::WriteAllText($fixture, "shiva-aap-canary",
              [System.Text.UTF8Encoding]::new($false))
          $hostSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls.exe $fixture /inheritance:r | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Canary inheritance removal failed" }
          & icacls.exe $fixture /grant:r "*$($hostSid):(R)" "*S-1-15-2-1:(R)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "AAP canary ACL grant failed" }
          if ([System.IO.File]::ReadAllText($fixture) -ne "shiva-aap-canary") {
            throw "Host AAP canary positive control failed"
          }
          "SHIVA_TEST_AAP_ONLY_FILE=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Exact package SID RX only; AAP-only fixture independently prepared"
      - name: Native AppContainer and Job deny E2E
        env:
          SHIVA_TEST_WORKER_BIN: ${{ github.workspace }}\target\debug\shiva-worker.exe
        run: cargo test -p shiva-worker-client --test host_process -- --nocapture
      - name: Win32 Worker unit / protocol check
        run: cargo test -p shiva-worker --lib
      - name: Compile native runner and guard
        run: cargo check -p shiva-worker-client -p shiva-worker
