name: Shiva offline PDF

on:
  pull_request:
    paths:
      - 'lib/src/typst.rs'
      - 'lib/src/pdf.rs'
      - 'lib/Cargo.toml'
      - 'docs/security/offline-fonts.md'
      - '.github/workflows/offline-pdf.yml'
  push:
    branches: [main]
    paths:
      - 'lib/src/typst.rs'
      - 'lib/src/pdf.rs'
      - 'lib/Cargo.toml'
      - 'docs/security/offline-fonts.md'
      - '.github/workflows/offline-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Upstream markdown.rs test module also imports html and serde_xml_rs.
      - name: Run font offline/error-path corpus
        run: cargo test -p shiva --no-default-features --features pdf,markdown,html,xml --lib offline_font_tests
      - name: Compile PDF and Markdown converters
        run: cargo check -p shiva --no-default-features --features pdf,markdown,html,xml
      # This exercises actual PDF generation, unlike the font-loading unit tests.
      # Cargo unit tests run with lib/ as their working directory, so use an absolute path.
      - name: Reject duplicated text across two PDF content streams
        run: cargo test -p shiva --no-default-features --features pdf,markdown,html,xml --lib pdf::tests::multi_stream_page_does_not_duplicate_extracted_text -- --nocapture
      - name: Prove bounded Identity-H ToUnicode bfchar/bfrange and missing-CMap denial
        run: cargo test -p shiva --no-default-features --features pdf,markdown,html,xml --lib pdf::tests::cid_identity_h -- --nocapture
      - name: Reject compressed PDF page exceeding decoded 8-MiB budget
        run: cargo test -p shiva --no-default-features --features pdf,markdown,html,xml --lib pdf::tests::cid_page_decompression_budget_fails_closed -- --nocapture
      - name: Prove PDF cumulative decoded-page and text budgets with linear Tm corpus
        run: cargo test -p shiva --no-default-features --features pdf,markdown,html,xml --lib pdf::tests::total_budget_ -- --nocapture
      - name: Reject synthetic malformed PDF /Contents, CMap, deep arrays and unknown fonts
        run: cargo test -p shiva --no-default-features --features pdf,markdown,html,xml --lib pdf::hostile_tests::hostile_ -- --nocapture
      - name: Prove complete strict ordered PDF page trees and reject corrupt /Kids
        run: cargo test -p shiva --no-default-features --features pdf,markdown,html,xml --lib pdf::page_tree_tests::tree_ -- --nocapture

      - name: Generate a minimal real PDF with provisioned local fonts
        env:
          SHIVA_FONT_DIR: ${{ github.workspace }}/lib/fonts
        run: cargo test -p shiva --no-default-features --features pdf,markdown,html,xml --lib pdf::tests::test_minimal_pdf_offline
      - name: Verify existing PDF hyperlink generation
        env:
          SHIVA_FONT_DIR: ${{ github.workspace }}/lib/fonts
        run: cargo test -p shiva --no-default-features --features pdf,markdown,html,xml --lib pdf::tests::test_hyperlink_generation -- --nocapture
