name: Shiva DjVu ready-model OCR lab

on:
  pull_request:
    paths:
      - '.github/workflows/djvu-ready-ocr-qa.yml'
      - 'scripts/ci/ready_ocr_lab.py'
      - 'scripts/ci/test_ready_ocr_lab.py'
      - 'scripts/ci/ocr_review_projection.py'
      - 'scripts/ci/test_ocr_review_projection.py'
      - 'scripts/ci/check_ocr_go_figure.py'
      - 'docs/research/djvu-ocr-review-01.md'
      - 'scripts/ci/private_djvu_render_audit.py'
      - 'scripts/ci/test_private_djvu_render_audit.py'
      - 'docs/research/djvu-real-book-01.md'
      - 'docs/research/djvu-ready-ocr-01.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/djvu-ready-ocr-qa.yml'
      - 'scripts/ci/ready_ocr_lab.py'
      - 'scripts/ci/test_ready_ocr_lab.py'
      - 'scripts/ci/ocr_review_projection.py'
      - 'scripts/ci/test_ocr_review_projection.py'
      - 'scripts/ci/check_ocr_go_figure.py'
      - 'docs/research/djvu-ocr-review-01.md'
      - 'scripts/ci/private_djvu_render_audit.py'
      - 'scripts/ci/test_private_djvu_render_audit.py'
      - 'docs/research/djvu-real-book-01.md'
      - 'docs/research/djvu-ready-ocr-01.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shiva-djvu-ready-ocr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-synthetic-djvu:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent DjVu encoder / decoder, native OCR, fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y djvulibre-bin tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng fonts-dejavu-core
          for tool in cjb2 djvm ddjvu tesseract; do command -v "$tool"; done
      - name: QA-only dependencies and published pure-Rust DjVu wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: pillow==11.3.0 psutil==7.0.0
          python -m pip install --only-binary=:all: --no-deps djvu-rs==0.43.0
          python -m pip check
          python -c 'import djvu_rs; print("djvu-rs wheel import PASS")'
      - name: Run fast offline unit tests
        shell: bash
        run: python -m unittest -v scripts/ci/test_ready_ocr_lab.py scripts/ci/test_private_djvu_render_audit.py
      - name: Construct independent four-page Cyrillic DjVu
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/ready_ocr_lab.py --step generate --out "$RUNNER_TEMP/shiva-djvu-ready-ocr" --require-djvu-rs
      - name: Confirm full read-only streaming on all four synthetic DjVu pages
        shell: bash
        run: |
          set -euo pipefail
          source_file="$RUNNER_TEMP/shiva-djvu-ready-ocr/fixture/synthetic_book.djvu"
          expected=$(sha256sum "$source_file" | awk '{print $1}')
          python scripts/ci/private_djvu_render_audit.py \
            --source "$source_file" --expected-sha256 "$expected" \
            --expected-pages 4 --dpi 300 --batch-pages 2 \
            --out "$RUNNER_TEMP/shiva-djvu-ready-ocr/render_audit.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["pages_rendered"] == 4 and d["source_unchanged"] and d["no_source_bytes_images_or_ocr_text_in_output"]' \
            "$RUNNER_TEMP/shiva-djvu-ready-ocr/render_audit.json"
      - name: Fetch immutable published Tesseract fast + best weights and verify Git blobs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/ready_ocr_lab.py --step fetch-models --out "$RUNNER_TEMP/shiva-djvu-ready-ocr"
      - name: Decode DjVu in Rust, check DjVuLibre parity and measure actual OCR CER/WER
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/ready_ocr_lab.py --step measure --out "$RUNNER_TEMP/shiva-djvu-ready-ocr" --models system,fast,best --require-djvu-rs
          cat "$RUNNER_TEMP/shiva-djvu-ready-ocr/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Review Go-diagram OCR candidates without silent text deletion
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/ci python -m unittest -v scripts/ci/test_ocr_review_projection.py
          python scripts/ci/check_ocr_go_figure.py --djvu-rs --out "$RUNNER_TEMP/shiva-djvu-ready-ocr"
          cat "$RUNNER_TEMP/shiva-djvu-ready-ocr/figure_quality.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload text-only synthetic evidence (never book, pixels, weights or OCR text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiva-djvu-ready-ocr-synthetic-evidence
          path: |
            ${{ runner.temp }}/shiva-djvu-ready-ocr/render_audit.json
            ${{ runner.temp }}/shiva-djvu-ready-ocr/model_receipts.json
            ${{ runner.temp }}/shiva-djvu-ready-ocr/result.json
            ${{ runner.temp }}/shiva-djvu-ready-ocr/summary.md
            ${{ runner.temp }}/shiva-djvu-ready-ocr/figure_quality.json
          if-no-files-found: warn
          retention-days: 14