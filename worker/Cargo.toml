[package]
name = "shiva-worker"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Linux-only, fail-closed proof of a sandboxed Shiva document extractor"

[features]
default = []
# Linux debug-only laboratory gate. Release builds must never admit PDF.
qa-pdf-worker = ["shiva/pdf"]

[dependencies]
shiva = { path = "../lib", default-features = false, features = ["text", "markdown", "html"] }
shiva-extractor-protocol = { path = "../extractor-protocol" }
bytes = "1"
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Networking_WinSock"] }
